<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Envelope body -->
  <rect x="0" y="0" width="400" height="300" fill="#722F37"/>
  
  <!-- Inner border -->
  <rect x="10" y="10" width="380" height="280" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>
  
  <!-- Decorative pattern -->
  <g opacity="0.1">
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#FDF8F3"/>
    </pattern>
    <rect x="20" y="20" width="360" height="260" fill="url(#dots)"/>
  </g>
  
  <!-- Wax seal placeholder -->
  <circle cx="200" cy="150" r="40" fill="#5a252c"/>
  <circle cx="200" cy="150" r="35" fill="#722F37"/>
  <circle cx="200" cy="150" r="28" fill="#5a252c"/>
  <text x="200" y="158" text-anchor="middle" fill="#D4AF37" font-family="serif" font-size="24">W</text>
</svg>