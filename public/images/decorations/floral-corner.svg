    <circle cx="85" cy="100" r="3" fill="#722F37" opacity="0.7"/>
    <circle cx="120" cy="55" r="3" fill="#722F37" opacity="0.7"/>
    <circle cx="160" cy="20" r="3" fill="#722F37" opacity="0.7"/>
    
    <!-- Gold accents -->
