    <circle cx="70" cy="120" r="2" fill="#D4AF37" opacity="0.8"/>
    <circle cx="105" cy="75" r="2" fill="#D4AF37" opacity="0.8"/>
    <circle cx="140" cy="40" r="2" fill="#D4AF37" opacity="0.8"/>
