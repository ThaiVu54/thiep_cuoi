    <path d="M45 155 Q 35 140, 50 130 Q 65 140, 55 155 Q 50 160, 45 155" fill="#722F37" opacity="0.5"/>
    
    <!-- Leaves cluster 2 -->
    <path d="M60 130 Q 50 115, 65 105 Q 80 115, 70 130 Q 65 135, 60 130" fill="#722F37" opacity="0.6"/>
    <path d="M75 115 Q 65 100, 80 90 Q 95 100, 85 115 Q 80 120, 75 115" fill="#722F37" opacity="0.5"/>
    
    <!-- Leaves cluster 3 -->
