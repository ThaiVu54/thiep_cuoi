name: Deploy Vercel Production (dev)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: vercel-prod-dev
  cancel-in-progress: true

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Deploy Hook secret
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is missing. Add it in GitHub Secrets."
            exit 1
          fi

      - name: Trigger Vercel Deploy Hook
        run: |
          curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
          echo "Deploy Hook triggered successfully."
