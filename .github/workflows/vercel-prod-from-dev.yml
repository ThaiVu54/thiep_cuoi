name: Deploy Vercel Production (dev)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: vercel-prod-dev
  cancel-in-progress: true

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_Bvemnk1bLxMCRcY5LgNF0tBv
      VERCEL_PROJECT_ID: prj_dVeuJQUsG4ufNT9UFZW8SL7yW9pB
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate Vercel token
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "VERCEL_TOKEN is missing. Add it in GitHub Secrets."
            exit 1
          fi

      - name: Deploy to Production
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} --scope=thaivu54s-projects
